architectury {
	common rootProject.enabled_platforms.split(',')
}

loom {
	accessWidenerPath = file('src/main/resources/chiselsandbits.accesswidener')
}

dependencies {
	implementation "dev.architectury:architectury:${rootProject.architectury_version}"
	compileOnly "dev.architectury:architectury-injectables:1.0.10"

	compileOnly("me.fzzyhmstrs:fzzy_config:${rootProject.fzzy_config_version}") {
		exclude group: 'com.terraformersmc', module: 'modmenu'
	}
	testImplementation("me.fzzyhmstrs:fzzy_config:${rootProject.fzzy_config_version}") {
		exclude group: 'com.terraformersmc', module: 'modmenu'
	}
	compileOnly "net.peanuuutz.tomlkt:tomlkt-jvm:0.3.7"
}

def faceRegionMergeCheck = tasks.register('faceRegionMergeCheck', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'mod.chiselsandbits.render.chiseledblock.FaceRegionMergeCheck'
}

def legacyBlobCompatibilityCheck = tasks.register('legacyBlobCompatibilityCheck', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'mod.chiselsandbits.mixin.LegacyBlobCompatibilityCheck'
}

def legacyConfigurationMigrationCheck = tasks.register('legacyConfigurationMigrationCheck', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'mod.chiselsandbits.config.LegacyConfigurationMigrationCheck'
}

def mirrorPrintDropCheck = tasks.register('mirrorPrintDropCheck', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'mod.chiselsandbits.items.MirrorPrintDropCheck'
}

def blockBitsTabCheck = tasks.register('blockBitsTabCheck', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'mod.chiselsandbits.registry.BlockBitsTabCheck'
}

tasks.named('test') {
	failOnNoDiscoveredTests.set(false)
}

tasks.named('check') {
	dependsOn faceRegionMergeCheck
	dependsOn mirrorPrintDropCheck
	dependsOn blockBitsTabCheck
	dependsOn legacyBlobCompatibilityCheck
	dependsOn legacyConfigurationMigrationCheck
}
