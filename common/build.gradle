architectury {
	common rootProject.enabled_platforms.split(',')
}

def fzzyConfig = { String configuration ->
	dependencies.add(configuration, "me.fzzyhmstrs:fzzy_config:${rootProject.fzzy_config_version}") {
		exclude group: 'com.terraformersmc', module: 'modmenu'
	}
}

dependencies {
	implementation "dev.architectury:architectury:${rootProject.architectury_version}"
	compileOnly "dev.architectury:architectury-injectables:1.0.10"
	compileOnly "net.peanuuutz.tomlkt:tomlkt-jvm:0.3.7"

	fzzyConfig 'compileOnly'
	fzzyConfig 'testImplementation'
}

def standaloneChecks = [
	shapeMesherCheck                 : 'mod.chiselsandbits.render.chiseledblock.ShapeMesherCheck',
	legacyBlobCompatibilityCheck     : 'mod.chiselsandbits.mixin.LegacyBlobCompatibilityCheck',
	legacyConfigurationMigrationCheck: 'mod.chiselsandbits.config.LegacyConfigurationMigrationCheck',
	mirrorPrintDropCheck             : 'mod.chiselsandbits.items.MirrorPrintDropCheck',
	blockBitsTabCheck                : 'mod.chiselsandbits.registry.BlockBitsTabCheck',
]

def checkTasks = standaloneChecks.collect { name, entryPoint ->
	tasks.register(name, JavaExec) {
		dependsOn testClasses
		classpath = sourceSets.test.runtimeClasspath
		it.mainClass = entryPoint
	}
}

// Not part of check: replays the old and new meshers over a real world, e.g. -PbenchWorld=/path/to/world
tasks.register('meshBenchmark', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'mod.chiselsandbits.render.chiseledblock.MeshBenchmark'
	maxHeapSize = '4g'
	args = [
		project.findProperty('benchWorld') ?: '',
		project.findProperty('benchRadius') ?: ''
	]
}

tasks.named('test') {
	failOnNoDiscoveredTests.set(false)
}

tasks.named('check') {
	dependsOn checkTasks
}
