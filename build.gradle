plugins {
	id 'architectury-plugin' version "${architectury_plugin_version}"
	id 'dev.architectury.loom-no-remap' version "${loom_version}" apply false
	id 'com.diffplug.spotless' version "${spotless_version}" apply false
	id 'com.gradleup.shadow' version '9.4.2' apply false
}

architectury {
	minecraft = rootProject.minecraft_version
}

allprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'architectury-plugin'
	apply plugin: 'com.diffplug.spotless'

	if (project.name != 'neoforge') {
		apply plugin: 'dev.architectury.loom-no-remap'
	}

	base {
		archivesName = "${rootProject.archives_base_name}-${project.name}"
	}

	version = "${rootProject.mod_version}+${rootProject.minecraft_version}"

	repositories {
		mavenCentral()
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://maven.neoforged.net/releases' }
		maven { url = 'https://maven.fzzyhmstrs.me/' }
	}

	dependencies {
		if (project.name != 'neoforge') {
			minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
		}
	}

	java {
		withSourcesJar()
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}

	spotless {
		java {
			palantirJavaFormat()
		}
		groovyGradle {
			greclipse()
		}
	}
}
