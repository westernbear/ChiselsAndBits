plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.diffplug.spotless' version "${spotless_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = "Fuzs Mod Resources"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}
}

loom {
	accessWidenerPath = file('src/main/resources/chiselsandbits.accesswidener')

	runs {

		client {

			property 'mixin.debug', 'true'
			programArgs '--username', 'Dev'

			ideConfigGenerated = true
			runDir = 'run-client'
		}

		server {

			property 'mixin.debug', 'true'
			runDir = 'run-server'

			ideConfigGenerated = true
		}
	}
}


dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${config_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

def faceRegionMergeCheck = tasks.register("faceRegionMergeCheck", JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "mod.chiselsandbits.render.chiseledblock.FaceRegionMergeCheck"
}

tasks.named("test") {
	failOnNoDiscoveredTests.set(false)
}

tasks.named("check") {
	dependsOn faceRegionMergeCheck
}

javadoc{
	failOnError = false
}

java {
	withSourcesJar()
	withJavadocJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

spotless {
	java {
		palantirJavaFormat()
	}

	groovyGradle {
		greclipse()
	}
}
