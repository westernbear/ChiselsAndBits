plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.diffplug.spotless' version "${spotless_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	gametest {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}

configurations {
	gametestImplementation.extendsFrom implementation
	gametestRuntimeOnly.extendsFrom runtimeOnly
}

repositories {
	mavenCentral()
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = 'Fzzy Config'
		url = 'https://maven.fzzyhmstrs.me/'
	}
}

loom {
	accessWidenerPath = file('src/main/resources/chiselsandbits.accesswidener')

	mods {
		chiselsandbits {
			sourceSet sourceSets.main
		}
		chiselsandbits_test {
			sourceSet sourceSets.gametest
		}
	}

	runs {

		client {

			property 'mixin.debug', 'true'
			programArgs '--username', 'Dev'

			ideConfigGenerated = true
			runDir = 'run-client'
		}

		server {

			property 'mixin.debug', 'true'
			runDir = 'run-server'

			ideConfigGenerated = true
		}

		gametest {
			inherit server
			name = 'Game Test'
			source sourceSets.gametest
			vmArg '-Dfabric-api.gametest'
			vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-report.xml').get().asFile}"
			runDir = 'build/gametest'
			ideConfigGenerated = true
		}

		clientGametest {
			inherit client
			name = 'Client Game Test'
			source sourceSets.gametest
			vmArg '-Dfabric.client.gametest'
			runDir = 'build/client-gametest'
			ideConfigGenerated = true
		}
	}
}


dependencies {
	// Minecraft 26.2 ships named Mojang classes; no Yarn mapping artifact exists for this version.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation("me.fzzyhmstrs:fzzy_config:${fzzy_config_version}") {
		exclude group: 'com.terraformersmc', module: 'modmenu'
	}
	compileOnly "net.peanuuutz.tomlkt:tomlkt-jvm:0.3.7" // Bundled by Fzzy Config at runtime.
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

def faceRegionMergeCheck = tasks.register("faceRegionMergeCheck", JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "mod.chiselsandbits.render.chiseledblock.FaceRegionMergeCheck"
}

def legacyBlobCompatibilityCheck = tasks.register("legacyBlobCompatibilityCheck", JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "mod.chiselsandbits.mixin.LegacyBlobCompatibilityCheck"
}

def legacyConfigurationMigrationCheck = tasks.register("legacyConfigurationMigrationCheck", JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "mod.chiselsandbits.config.LegacyConfigurationMigrationCheck"
}

tasks.named("test") {
	failOnNoDiscoveredTests.set(false)
}

tasks.named("check") {
	dependsOn faceRegionMergeCheck
	dependsOn legacyBlobCompatibilityCheck
	dependsOn legacyConfigurationMigrationCheck
	dependsOn tasks.named("runGametest")
}

javadoc{
	failOnError = false
}

java {
	withSourcesJar()
	withJavadocJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

spotless {
	java {
		palantirJavaFormat()
	}

	groovyGradle {
		greclipse()
	}
}
