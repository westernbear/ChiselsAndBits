name: build
on: [ pull_request, push ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, neoforge ]
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - name: build ${{ matrix.loader }}
        run: ./gradlew :${{ matrix.loader }}:build
      - name: select ${{ matrix.loader }} release jar
        env:
          LOADER: ${{ matrix.loader }}
        run: |
          set -euo pipefail
          mkdir -p release-jars
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          mc_version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          jar="${LOADER}/build/libs/chiselsandbits-${LOADER}-${mod_version}+${mc_version}.jar"
          if [[ ! -f "$jar" ]]; then
            echo "Missing release jar: $jar" >&2
            ls -la "${LOADER}/build/libs" >&2 || true
            exit 1
          fi
          cp "$jar" "release-jars/"
          echo "Selected $jar"
      - name: capture ${{ matrix.loader }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chiselsandbits-${{ matrix.loader }}
          path: release-jars/*.jar
          if-no-files-found: error

  fabric-gametest:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - name: fabric gametest
        run: timeout 20m ./gradlew :fabric:runGametest
      - name: fabric client gametest
        run: timeout 20m xvfb-run -a ./gradlew :fabric:runClientGametest

  neoforge-gametest:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - name: neoforge gametest
        run: |
          set -euo pipefail
          gametest_log="$(mktemp)"
          set +e
          timeout 20m ./gradlew :neoforge:runGametest --console=plain 2>&1 | tee "$gametest_log"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 124 ]] && grep -Eq 'All [0-9]+ required tests passed :\)' "$gametest_log"; then
            echo "NeoForge GameTests completed successfully but the process did not exit before timeout."
            echo "Treating this as a pass to avoid false-negative CI failures."
            exit 0
          fi
          exit "$status"

  neoforge-client-smoke:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - name: neoforge client render smoke
        env:
          CHISELSANDBITS_CLIENT_SMOKE: '1'
        run: timeout 20m xvfb-run -a ./gradlew :neoforge:runClient

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, fabric-gametest, neoforge-gametest, neoforge-client-smoke ]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: download fabric artifact
        uses: actions/download-artifact@v4
        with:
          name: chiselsandbits-fabric
          path: artifacts/fabric
      - name: download neoforge artifact
        uses: actions/download-artifact@v4
        with:
          name: chiselsandbits-neoforge
          path: artifacts/neoforge
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fabric_jars=(artifacts/fabric/*.jar)
          neoforge_jars=(artifacts/neoforge/*.jar)
          if (( ${#fabric_jars[@]} != 1 )) || [[ ! -f "${fabric_jars[0]}" ]]; then
            echo "Expected one Fabric jar under artifacts/fabric, found: ${fabric_jars[*]:-}" >&2
            exit 1
          fi
          if (( ${#neoforge_jars[@]} != 1 )) || [[ ! -f "${neoforge_jars[0]}" ]]; then
            echo "Expected one NeoForge jar under artifacts/neoforge, found: ${neoforge_jars[*]:-}" >&2
            exit 1
          fi
          echo "Publishing:"
          echo "  fabric:   ${fabric_jars[0]}"
          echo "  neoforge: ${neoforge_jars[0]}"
          gh release create "$GITHUB_REF_NAME" \
            "${fabric_jars[0]}" \
            "${neoforge_jars[0]}" \
            --verify-tag \
            --generate-notes
