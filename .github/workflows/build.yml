name: build
on: [ pull_request, push ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, neoforge ]
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - name: build ${{ matrix.loader }}
        run: ./gradlew :${{ matrix.loader }}:build
      - name: capture ${{ matrix.loader }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chiselsandbits-${{ matrix.loader }}
          path: ${{ matrix.loader }}/build/libs/

  fabric-gametest:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
      - name: fabric gametest
        run: ./gradlew :fabric:runGametest
      - name: fabric client gametest
        run: xvfb-run -a ./gradlew :fabric:runClientGametest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, fabric-gametest ]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: download fabric artifact
        uses: actions/download-artifact@v4
        with:
          name: chiselsandbits-fabric
          path: artifacts/fabric
      - name: download neoforge artifact
        uses: actions/download-artifact@v4
        with:
          name: chiselsandbits-neoforge
          path: artifacts/neoforge
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/**/*.jar --verify-tag --generate-notes
