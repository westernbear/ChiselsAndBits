plugins {
	id 'net.neoforged.moddev' version '2.0.148'
}

dependencies {
	// Common is compiled against but supplied at runtime as the Architectury-transformed
	// output below: ModDevGradle does not apply the @ExpectPlatform rewriting itself.
	compileOnly project(':common')

	implementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

	implementation("me.fzzyhmstrs:fzzy_config:${rootProject.fzzy_config_version}+neoforge") {
		exclude group: 'com.terraformersmc', module: 'modmenu'
	}
}

configurations {
	transformedCommon {
		canBeConsumed = false
		canBeResolved = true
	}
}

dependencies {
	transformedCommon(project(path: ':common', configuration: 'transformProductionNeoForge'))
}

// The transformed common classes must live in this module's output, not in a separate jar:
// NeoForge's module class loader rejects cross-loader calls into it (LinkageError).
def extractTransformedCommon = tasks.register('extractTransformedCommon', Sync) {
	dependsOn configurations.transformedCommon
	from { zipTree(configurations.transformedCommon.singleFile) }
	into layout.buildDirectory.dir('transformed-common')
	includeEmptyDirs = false
}

sourceSets.main.output.dir(layout.buildDirectory.dir('transformed-common'), builtBy: extractTransformedCommon)

sourceSets {
	gametest {
		java.srcDir project(':common').file('src/gametest/java')
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}

configurations {
	gametestImplementation.extendsFrom implementation
	gametestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
	enable {
		version = rootProject.neoforge_version
	}

	mods {
		chiselsandbits {
			sourceSet sourceSets.main
			sourceSet sourceSets.gametest
		}
	}

	runs {
		client {
			client()
			programArguments.addAll('--username', 'Dev')
		}

		server {
			server()
		}

		gametest {
			type = 'gameTestServer'
			sourceSet = sourceSets.gametest
		}
	}
}

processResources {
	inputs.property 'version', project.version
	filesMatching('META-INF/neoforge.mods.toml') {
		expand 'version': project.version
	}
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

tasks.named('compileJava').configure {
	dependsOn ':common:classes'
}
